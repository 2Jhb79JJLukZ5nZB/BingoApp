<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f5f4" />
  <meta name="description" content="Googleスライドを表示しながらビンゴ番号を管理できるアプリです。" />
  <title>ビンゴボード</title>
  <link rel="stylesheet" href="popup.css?v=6" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <script src="config.js?v=6" defer></script>
  <script src="bingo.js?v=6" defer></script>
  <script src="app.js?v=6" defer></script>
</head>
<body>
  <section class="view home-view" id="homeView">
    <div class="menu-card">
      <h1>ビンゴボード</h1>
      <button class="primary-button" id="openGame" type="button">スライドショーを開く</button>
      <button class="secondary-button" id="openRegister" type="button">番号を登録</button>
    </div>
  </section>
  <section class="view register-view" id="registerView" hidden>
    <header class="page-header"><button class="back-button" data-back type="button">← 戻る</button><h1>番号を登録</h1></header>
    <main class="register-content">
      <form class="register-form" id="registerForm">
        <label>特別番号<input id="specialNumber" type="number" min="1" max="100" placeholder="1〜100" required /></label>
        <label>対応するスライド番号<input id="slideNumber" type="number" min="1" placeholder="例：7" required /></label>
        <button class="primary-button" type="submit">登録</button>
      </form>
      <p class="sync-status" id="syncStatus" role="status"></p>
      <div class="registration-list" id="registrationList"></div>
    </main>
  </section>
  <section class="view game-view" id="gameView" hidden>
    <main class="workspace">
      <section class="slides-panel" aria-label="Googleスライド">
        <button class="game-back-button" data-back type="button">← メニュー</button>
        <iframe id="slidesFrame" title="ビンゴ用スライド" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </section>
      <section class="board-panel" aria-label="ビンゴボード">
        <div class="popup-shell">
          <section class="number-area" id="numberArea" aria-label="呼ばれた番号の一覧">
            <div class="number-grid" id="numberGrid" aria-live="polite"></div>
            <div class="empty-state" id="emptyState"><p>番号を追加してください</p></div>
          </section>
          <footer class="entry-area">
            <form class="number-form" id="numberForm" novalidate>
              <div class="input-wrap"><label for="numberInput">番号</label><input id="numberInput" name="number" type="number" min="1" max="100" inputmode="numeric" autocomplete="off" placeholder="1〜100" required /></div>
              <button class="add-button" type="submit">追加</button>
            </form>
            <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
            <p class="entry-hint">追加ボタンまたはEnterキーを押して番号を追加</p>
          </footer>
        </div>
      </section>
    </main>
  </section>
</body>
</html>
