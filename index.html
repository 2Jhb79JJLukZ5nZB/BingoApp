<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f5f4" />
  <meta name="description" content="世界遺産クイズとビンゴを同時に楽しめるウェブアプリです。" />
  <title>世界遺産ビンゴ</title>
  <link rel="stylesheet" href="popup.css?v=7" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <script src="heritages.js?v=1" defer></script>
  <script src="bingo.js?v=7" defer></script>
  <script src="app.js?v=9" defer></script>
</head>
<body>
  <section class="view home-view" id="homeView">
    <div class="menu-card">
      <h1>世界遺産ビンゴ</h1>
      <button class="primary-button" id="openGame" type="button">ゲームを開く</button>
    </div>
  </section>
  <section class="view game-view" id="gameView" hidden>
    <main class="workspace">
      <section class="heritage-panel" id="heritagePanel" tabindex="0" aria-label="世界遺産とクイズ">
        <div class="heritage-empty" id="heritageEmpty"><h1>世界遺産クイズ</h1><p>右側で番号を入力してください</p></div>
        <article class="heritage-card" id="heritageCard" hidden>
          <img id="heritageImage" alt="" />
          <div class="image-shade" aria-hidden="true"></div>
          <div class="heritage-content">
            <p class="heritage-rank" id="heritageRank"></p>
            <h1 id="heritageName"></h1>
            <section class="quiz-box" id="quizBox" hidden><p class="quiz-label" id="quizLabel">QUIZ</p><p class="quiz-text" id="quizText"></p></section>
            <p class="advance-hint" id="advanceHint">画面をクリック、またはキーを押してクイズを表示</p>
          </div>
          <a class="image-credit" id="imageCredit" target="_blank" rel="noopener noreferrer">画像：Wikimedia Commons</a>
        </article>
      </section>
      <section class="board-panel" aria-label="ビンゴボード">
        <div class="popup-shell">
          <section class="number-area" id="numberArea" aria-label="呼ばれた番号の一覧">
            <div class="number-grid" id="numberGrid" aria-live="polite"></div>
            <div class="empty-state" id="emptyState"><p>番号を追加してください</p></div>
          </section>
          <footer class="entry-area">
            <form class="number-form" id="numberForm" novalidate>
              <div class="input-wrap"><label for="numberInput">番号</label><input id="numberInput" name="number" type="number" min="1" max="1000" inputmode="numeric" autocomplete="off" placeholder="番号を入力" required /></div>
              <button class="add-button" type="submit">追加</button>
            </form>
            <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
            <p class="entry-hint">追加ボタンまたはEnterキーを押して番号を追加</p>
          </footer>
        </div>
      </section>
    </main>
  </section>
</body>
</html>
