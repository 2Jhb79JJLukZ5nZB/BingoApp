<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>ビンゴ番号ボード</title>
    <link rel="stylesheet" href="popup.css?v=4" />
    <script src="bingo.js?v=4" defer></script>
    <script src="popup.js?v=3" defer></script>
  </head>
  <body>
    <main class="popup-shell">
      <section class="number-area" id="numberArea" aria-label="呼ばれた番号の一覧">
        <div class="number-grid" id="numberGrid" aria-live="polite"></div>
        <div class="empty-state" id="emptyState">
          <p>番号を追加してください</p>
        </div>
      </section>

      <footer class="entry-area">
        <form class="number-form" id="numberForm" novalidate>
          <div class="input-wrap">
            <label for="numberInput">番号</label>
            <input
              id="numberInput"
              name="number"
              type="number"
              min="1"
              max="100"
              inputmode="numeric"
              autocomplete="off"
              placeholder="1〜100"
              required
            />
          </div>
          <button class="add-button" type="submit">追加</button>
        </form>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        <p class="entry-hint">追加ボタンまたはEnterキーを押して番号を追加</p>
      </footer>
    </main>
  </body>
</html>
